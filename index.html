<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Altitude – France et Belgique / Hoogte – Frankrijk en België</title>
<meta name="description" content="Connaître l’altitude d’un point en France et en Belgique. / De hoogte van een punt kennen in Frankrijk en België.">
<link rel="icon" href="altitud.png">
<link rel="apple-touch-icon" href="altitud.png">
<style>
  :root { --bg:#fff; --fg:#1b1f24; --muted:#5b6570; --card:#f2f4f7; --accent:#0b57d0; --err:#b3261e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14171a; --fg:#e8eaed; --muted:#9aa4af; --card:#20252b; --accent:#8ab4f8; --err:#f2b8b5; }
  }
  * { box-sizing:border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg);
         font:16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; max-width:640px; margin-inline:auto; }
  h1 { font-size:1.3rem; margin:4px 0 12px; }
  h2 { font-size:1.05rem; margin:20px 0 6px; }
  label { display:block; font-size:.9rem; color:var(--muted); margin:12px 0 4px; }
  input, select, textarea, button { font:inherit; padding:12px; border-radius:10px;
         border:1px solid var(--muted); background:var(--card); color:var(--fg); }
  input, select, textarea { width:100%; }
  textarea { min-height:90px; resize:vertical; }
  button { background:var(--accent); color:#fff; border:0; font-weight:600; margin-top:14px; width:100%; cursor:pointer; }
  button.sec { background:var(--card); color:var(--fg); border:1px solid var(--muted); margin-top:10px; }
  button:disabled { opacity:.5; cursor:default; }
  .switches { display:flex; gap:8px; margin:6px 0 8px; flex-wrap:wrap; }
  .sw { display:flex; gap:6px; }
  .sw button { margin:0; padding:8px 14px; width:auto; background:var(--card); color:var(--fg);
               border:1px solid var(--muted); border-radius:999px; font-size:.9rem; }
  .sw button.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  .tabs { display:flex; gap:8px; margin:6px 0 4px; }
  .tabs button { margin:0; padding:10px; font-weight:600; }
  .tabs button.active { background:var(--accent); color:#fff; }
  .tabs button:not(.active) { background:var(--card); color:var(--fg); border:1px solid var(--muted); }
  .mode { display:none; }
  .mode.on { display:block; }
  #res { margin-top:18px; padding:14px; background:var(--card); border-radius:12px; display:none; }
  #alt { font-size:2rem; font-weight:700; }
  #city { font-size:1.1rem; font-weight:600; margin-top:2px; }
  .err { color:var(--err); }
  .small { font-size:.85rem; color:var(--muted); word-break:break-all; }
  table { width:100%; border-collapse:collapse; margin-top:12px; font-size:.95rem; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--muted); }
  td.r { text-align:right; font-variant-numeric:tabular-nums; }
  a { color:var(--accent); }
  #chart { width:100%; height:auto; display:block; margin-top:14px; }
  :root { --prof: var(--accent); }
  .pgrid { stroke:var(--muted); opacity:.25; stroke-width:1; }
  .ptick { stroke:var(--muted); stroke-width:1; }
  .plab { fill:var(--muted); font-size:11px; font-family:inherit; }
  .pline { fill:none; stroke:var(--prof); stroke-width:2; stroke-linejoin:round; stroke-linecap:round; }
  .parea { fill:var(--prof); opacity:.12; }
  .pcl { stroke:var(--fg); stroke-width:1; opacity:.5; }
  .pdot { fill:var(--prof); stroke:var(--bg); stroke-width:2; }
  #profHover { margin-top:6px; min-height:1.4em; }
  .stats { display:grid; grid-template-columns:1fr 1fr; gap:8px 12px; margin-top:12px; }
  .stats div { background:var(--card); border-radius:10px; padding:8px 10px; }
  .stats span { display:block; font-size:.8rem; color:var(--muted); }
  .stats b { font-size:1.05rem; font-variant-numeric:tabular-nums; }
  #suggestions { margin-top:6px; }
  #suggestions button { display:block; text-align:left; margin:4px 0 0; padding:8px 10px; }
  .row2 { display:flex; gap:10px; }
  .row2 > div { flex:1; min-width:0; }
  .send { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:8px; margin-top:6px; }
  .send button { margin-top:0; }
  #sendMsg { min-height:1.3em; margin-top:6px; }
  #tableN { overflow-x:auto; }
  #tableN table { font-size:.8rem; width:auto; min-width:100%; }
  #tableN th, #tableN td { padding:4px 7px; white-space:nowrap; }
  #tableN th { position:sticky; top:0; background:var(--card); }
  #tableN .zone { font-weight:700; }
  .lg { display:inline-block; width:20px; border-top:2px solid var(--prof); vertical-align:middle; margin-right:6px; }
  .lg2 { border-top:2px dashed var(--fg); opacity:.75; }
  .pgps { fill:none; stroke:var(--fg); stroke-width:1.5; stroke-dasharray:5 4; opacity:.75; stroke-linejoin:round; }
  #profLegend { margin-top:6px; }
  #profGps { margin-top:4px; }
  #l93res { margin-top:8px; }
  #l93res b { font-variant-numeric:tabular-nums; }
</style>
</head>
<body>
<h1>Altitude <span id="paysTitre">France</span></h1>

<div class="switches">
  <div class="sw" id="swPays" role="group" aria-label="Pays / Land">
    <button data-pays="fr">🇫🇷 France</button>
    <button data-pays="be">🇧🇪 België</button>
  </div>
  <div class="sw" id="swLang" role="group" aria-label="Langue / Taal">
    <button data-lang="fr">FR</button>
    <button data-lang="nl">NL</button>
  </div>
</div>

<div class="tabs">
  <button id="tab1" class="active" data-i18n="tab1">Un point</button>
  <button id="tabN" data-i18n="tabN">Plusieurs points</button>
  <button id="tabP" data-i18n="tabP">Profil</button>
</div>

<!-- ================= UN POINT ================= -->
<div id="mode1" class="mode on">
  <label for="addr" data-i18n="addrLabel">Chercher une adresse (optionnel)</label>
  <input id="addr" autocomplete="off">
  <div id="suggestions"></div>

  <label for="coord" data-i18n="coordLabel">Coordonnées (copiées depuis Google Maps) — WGS 84, EPSG:4326</label>
  <input id="coord" inputmode="text" autocomplete="off">

  <p data-i18n-html="openIn">Ouvrir dans <a id="gmaps" target="_blank" rel="noopener">Google Maps</a> · <a id="amaps" target="_blank" rel="noopener">Plans (Apple)</a></p>

  <label for="resource" data-i18n="srcLabel">Source</label>
  <select id="resource"></select>

  <button id="go" data-i18n="go">Obtenir l’altitude</button>
  <button id="loc" class="sec" data-i18n="loc">Utiliser ma position actuelle</button>
  <button id="toN" class="sec" data-i18n="toN">Ajouter à Plusieurs points</button>

  <div class="send">
    <button id="toA" class="sec" data-i18n="toA">Définir comme point A du profil</button>
    <button id="toB" class="sec" data-i18n="toB">Définir comme point B du profil</button>
  </div>
  <div id="sendMsg" class="small" role="status"></div>

  <button id="toL93" class="sec only-fr" data-i18n="toL93">Convertir en Lambert 93 (RGF93)</button>
  <div id="l93res" class="small only-fr" role="status"></div>
  <button id="copyL93" class="sec only-fr" style="display:none" data-i18n="copyL93">Copier X ; Y</button>

  <div id="res">
    <div id="alt"></div>
    <button id="copyalt" class="sec" style="display:none" data-i18n="copyalt">Copier l’altitude</button>
    <div id="city"></div>
    <div id="msg"></div>
    <div id="lidarDate" class="small only-fr"></div>
    <div id="precision" class="small"></div>
    <p class="small"><span data-i18n="ptLabel">Point</span> : <span id="pt"></span></p>
    <p><a id="link" target="_blank" rel="noopener" data-i18n="openReq">Ouvrir la requête</a></p>
  </div>
</div>

<!-- ================= PLUSIEURS POINTS ================= -->
<div id="modeN" class="mode">
  <label for="coordsN" data-i18n="coordsNLabel">Une coordonnée par ligne (lat, lon) — WGS 84, EPSG:4326</label>
  <textarea id="coordsN"></textarea>
  <input type="file" id="fileN" accept=".txt,.csv,.gpx,.kml,text/plain,text/csv,application/gpx+xml,application/vnd.google-earth.kml+xml" hidden>
  <div class="send">
    <button id="loadN" class="sec" data-i18n="loadN">Charger un fichier de points (.txt, .csv, .gpx ou .kml)</button>
    <button id="clearN" class="sec" data-i18n="clearN">Vider la liste</button>
  </div>
  <div id="fileMsg" class="small" role="status"></div>
  <p class="small" data-i18n="coordsNHelp"></p>

  <label for="resourceN" data-i18n="srcLabel2">Source</label>
  <select id="resourceN"></select>

  <button id="goN" data-i18n="goN">Calculer les altitudes</button>
  <button id="csv" class="sec" style="display:none" data-i18n="csvN">Exporter en CSV</button>
  <div id="msgN"></div>
  <div id="tableN"></div>
</div>

<!-- ================= PROFIL ================= -->
<div id="modeP" class="mode">
  <div class="row2">
    <div>
      <label for="ptA" data-i18n="ptA">Point A (lat, lon – EPSG:4326)</label>
      <input id="ptA">
    </div>
    <div>
      <label for="ptB" data-i18n="ptB">Point B (lat, lon – EPSG:4326)</label>
      <input id="ptB">
    </div>
  </div>
  <div class="row2">
    <div>
      <label for="resourceP" data-i18n="srcLabel3">Source</label>
      <select id="resourceP"></select>
    </div>
    <div>
      <label for="nP" data-i18n="nP">Nombre de points du profil</label>
      <select id="nP"><option value="10" selected>10</option><option value="50">50</option><option value="100">100</option></select>
    </div>
  </div>
  <button id="goP" data-i18n="goP">Tracer le profil</button>
  <button id="swapAB" class="sec" data-i18n="swapAB">Inverser A et B</button>
  <input type="file" id="fileP" accept=".gpx,.kml,application/gpx+xml,application/vnd.google-earth.kml+xml" hidden>
  <button id="loadP" class="sec" data-i18n="loadP">Tracer le profil d’une trace GPX ou KML</button>
  <div id="msgP"></div>
  <div id="profResult" style="display:none">
    <svg id="chart" viewBox="0 0 640 260" role="img" aria-label="Profil altimétrique"></svg>
    <div id="profHover" class="small"></div>
    <div id="profLegend" class="small"></div>
    <div id="profGps" class="small"></div>
    <div id="profInfo" class="stats"></div>
    <button id="csvP" class="sec" style="display:none" data-i18n="csvP">Exporter le profil en CSV</button>
  </div>
</div>

function fillSources() {

    sel.innerHTML = Object.entries(srcs).map(([k, s]) => '<option value="' + k + '">' + t(s.label) + '</option>').join("");

  }

async function getElevations(pts, key) {
  const s = SOURCES[PAYS][key], out = [];
  for (let i = 0; i < pts.length; i += s.max) {
    if (i && s.delay) await sleep(s.delay);
    const r = await fetch(s.url(pts.slice(i, i + s.max)));
    if (!r.ok) throw new Error("HTTP " + r.status);
    const j = await r.json();
    s.read(j).forEach(z => out.push(typeof z === "number" && z > -9990 ? z : null));
  }
  return out;
}

function inCountry(p) {
  return PAYS === "fr"
    ? (p.lat >= 41 && p.lat <= 51.5 && p.lon >= -5.5 && p.lon <= 10)
    : (p.lat >= 49.45 && p.lat <= 51.55 && p.lon >= 2.5 && p.lon <= 6.45);
}

// --- Date d'acquisition du LiDAR HD (France : métadonnées des dalles, WFS Géoplateforme) ---
const WFS = "https://data.geopf.fr/wfs/ows";
const META_LAYER = "IGNF_LIDAR-HD_METADONNEE:metadata";
let dateToken = 0;

function findProp(props, re) {
  let nested = props.metadata;
  if (typeof nested === "string") { try { nested = JSON.parse(nested); } catch (e) { nested = null; } }
  for (const o of [props, nested]) {
    if (!o || typeof o !== "object") continue;
    for (const k of Object.keys(o)) { if (re.test(k) && o[k]) return o[k]; }
  }
  return null;
}

async function lidarDates(lat, lon) {
  const e = 0.00001;
  const bbox = [lat - e, lon - e, lat + e, lon + e].map(v => v.toFixed(7)).join(",") + ",urn:ogc:def:crs:EPSG::4326";
  const url = WFS + "?SERVICE=WFS&VERSION=2.0.0&REQUEST=GetFeature&TYPENAMES=" + encodeURIComponent(META_LAYER) +
              "&OUTPUTFORMAT=application%2Fjson&COUNT=10&BBOX=" + bbox;
  const r = await fetch(url);
  if (!r.ok) throw new Error("HTTP " + r.status);
  const j = await r.json();
  const deb = [], fin = [];
  for (const f of (j.features || [])) {
    const p = f.properties || {};
    const d = isoDay(findProp(p, /debut.*acquisition|acquisition.*debut/i));
    const g = isoDay(findProp(p, /fin.*acquisition|acquisition.*fin/i));
    if (d) deb.push(d);
    if (g) fin.push(g);
  }
  if (!deb.length && !fin.length) return null;
  const all = deb.concat(fin).sort();
  return { debut: (deb.length ? deb.slice().sort()[0] : all[0]), fin: (fin.length ? fin.slice().sort().pop() : all[all.length - 1]) };
}

async function showDate(p, resource) {
  if (PAYS !== "fr") { $("lidarDate").textContent = ""; return; }
  const el = $("lidarDate"), tok = ++dateToken;
  if (!resource.startsWith("ign_lidar_hd")) { el.textContent = ""; return; }
  el.textContent = t(M.lidarSearch);
  try {
    const d = await lidarDates(p.lat, p.lon);
    if (tok !== dateToken) return;
    if (!d) { el.textContent = t(M.lidarNone); return; }
    el.textContent = d.debut === d.fin
      ? t(M.lidarOne) + frDay(d.debut)
      : t(M.lidarFrom) + frDay(d.debut) + t(M.lidarTo) + frDay(d.fin);
  } catch (err) {
    if (tok === dateToken) el.textContent = t(M.lidarFail);
  }
}

async function cityOf(p) {
  if (PAYS === "fr") {
    const r = await fetch("https://geo.api.gouv.fr/communes?lat=" + p.lat.toFixed(7) + "&lon=" + p.lon.toFixed(7) +
                          "&fields=nom,codesPostaux,departement&format=json");
    if (!r.ok) throw new Error("HTTP " + r.status);
    const j = await r.json();
    if (!j.length) return null;
    const c = j[0];
    return { nom: c.nom, cp: c.codesPostaux && c.codesPostaux.length === 1 ? c.codesPostaux[0] : "",
             region: c.departement ? c.departement.nom : "" };
  }
  const r = await fetch("https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=10&addressdetails=1&accept-language=" +
                        LANG + "&lat=" + p.lat.toFixed(7) + "&lon=" + p.lon.toFixed(7));
  if (!r.ok) throw new Error("HTTP " + r.status);
  const j = await r.json();
  const a = j.address;
  if (!a) return null;
  const nom = a.municipality || a.city || a.town || a.village || a.county || null;
  if (!nom) return null;
  return { nom, cp: a.postcode || "", region: a.state || "" };
}

}

// Accepte « 46.7256825, -1.5683537 » ou « 46°42'59.5"N 1°34'08.2"W »
function parse(s) {
  s = String(s || "").trim();
  if (!s) return null;
  if (s.includes("°")) {
    const re = /(\d+(?:[.,]\d+)?)\s*°\s*(?:(\d+(?:[.,]\d+)?)\s*['’′]\s*)?(?:(\d+(?:[.,]\d+)?)\s*(?:"|”|″|'')\s*)?([NSEWO])/gi;
    let m, lat = null, lon = null;
    while ((m = re.exec(s)) !== null) {
      let v = num(m[1]) + (m[2] ? num(m[2]) / 60 : 0) + (m[3] ? num(m[3]) / 3600 : 0);
      const h = m[4].toUpperCase();
      if (h === "S" || h === "W" || h === "O") v = -v;
      if (h === "N" || h === "S") lat = v; else lon = v;
    }
    if (lat === null || lon === null) return null;
    return { lat, lon };
  }
  const n = s.match(/-?\d+(?:[.,]\d+)?/g);
  if (!n || n.length < 2) return null;
  return { lat: num(n[0]), lon: num(n[1]) };
}

});

// Sommets d'une polyligne KML (LineString, ou gx:Track). Attention : KML écrit « longitude,latitude,altitude ».
function kmlVertices(text) {
  const doc = new DOMParser().parseFromString(text, "application/xml");
  if (doc.getElementsByTagName("parsererror").length) return null;
  let tokens = [];
  for (const n of doc.getElementsByTagName("LineString")) {
    const c = n.getElementsByTagName("coordinates")[0];
    if (c) tokens = tokens.concat(c.textContent.trim().split(/\s+/));
  }
  if (!tokens.length) for (const n of doc.getElementsByTagName("gx:coord")) tokens.push(n.textContent.trim().split(/\s+/).join(","));
  if (!tokens.length) for (const n of doc.getElementsByTagName("Point")) {
    const c = n.getElementsByTagName("coordinates")[0];
    if (c) tokens.push(c.textContent.trim());
  }
  const pts = []; let skipped = 0;
  for (const t2 of tokens) {
    if (!t2) continue;
    const f = t2.split(",");
    const p = { lon: parseFloat(f[0]), lat: parseFloat(f[1]), ele: f.length > 2 ? parseFloat(f[2]) : NaN };
    if (isNaN(p.lat) || isNaN(p.lon) || Math.abs(p.lat) > 90 || Math.abs(p.lon) > 180) skipped++; else pts.push(p);
  }
  // Une altitude toujours à 0 est un simple remplissage (tracé « collé au sol »), pas une mesure
  if (pts.every(p => isNaN(p.ele) || p.ele === 0)) pts.forEach(p => { p.ele = NaN; });
  return { pts, skipped };
}

const sg = d => (d > 0 ? "+" : d < 0 ? "−" : "") + Math.abs(d).toFixed(1) + " m";
// Une ligne peut porter une 3e valeur : l'altitude relevée par l'appareil (fichier GPX), comparée à l'altitude calculée
function lineEle(l) {
  if (l.includes("°")) return null;
  const n = l.match(/-?\d+(?:[.,]\d+)?/g);
  return n && n.length >= 3 ? num(n[2]) : null;
}
const hasEle = () => lastMulti.some(p => p.ele != null && !isNaN(p.ele));
const diffOf = p => (p.ele != null && !isNaN(p.ele) && p.z != null && p.z > -99990) ? p.ele - p.z : null;
const eleHead = () => hasEle() ? "<th>" + t(M.ELE.gpx) + "</th><th>" + t(M.ELE.diff) + "</th>" : "";
function eleCells(p) {
  if (!hasEle()) return "";
  const d = diffOf(p);
  return "<td class='r'>" + (p.ele != null && !isNaN(p.ele) ? p.ele.toFixed(1) + " m" : "—") + "</td><td class='r'>" + (d !== null ? sg(d) : "—") + "</td>";
}
function eleSummary() {
  if (!hasEle()) return "";
  const ds = lastMulti.map(diffOf).filter(d => d !== null);
  if (!ds.length) return "";
  const mean = ds.reduce((s, d) => s + d, 0) / ds.length, abs = ds.reduce((s, d) => s + Math.abs(d), 0) / ds.length;
  return "<p class='small'>" + t(M.ELE.summary, mean, abs, ds.length) + "</p>";
}

(function () {

    const lines = text.replace(/^\ufeff/, "").split(/\r?\n/).map(l => l.trim()).filter(Boolean);
    const pts = []; let skipped = 0, latI = -1, lonI = -1, eleI = -1, delim = ",", start = 0;
    if (lines.length && /[a-z]/i.test(lines[0]) && !lines[0].includes("°")) {   // première ligne = en-têtes

      eleI = cols.findIndex(c => /^(ele|elevation|altitude_gpx|hoogte_gps|alt_gps)/.test(c));
      start = 1;
    }
    for (let i = start; i < lines.length; i++) {
      const line = lines[i]; let p = null;
      if (latI >= 0 && lonI >= 0) {
        const f = line.split(delim);
        p = { lat: num(f[latI]), lon: num(f[lonI]), ele: eleI >= 0 ? num(f[eleI]) : NaN };

// --- Conversion latitude / longitude (WGS84) vers RGF93 / Lambert 93 (EPSG:2154) ---
// Projection conique conforme à 2 parallèles (44° et 49°), origine 46,5° N / 3° E, ellipsoïde GRS80.
function toLambert93(lat, lon) {
  const a = 6378137, e = 0.0818191910428158, rad = Math.PI / 180;
  const m = p => Math.cos(p) / Math.sqrt(1 - e * e * Math.sin(p) ** 2);
  const t2 = p => Math.tan(Math.PI / 4 - p / 2) / Math.pow((1 - e * Math.sin(p)) / (1 + e * Math.sin(p)), e / 2);
  const p1 = 44 * rad, p2 = 49 * rad, p0 = 46.5 * rad, l0 = 3 * rad;
  const n = (Math.log(m(p1)) - Math.log(m(p2))) / (Math.log(t2(p1)) - Math.log(t2(p2)));
  const F = m(p1) / (n * Math.pow(t2(p1), n));
  const rho = a * F * Math.pow(t2(lat * rad), n), rho0 = a * F * Math.pow(t2(p0), n);
  const th = n * (lon * rad - l0);
  return { x: 700000 + rho * Math.sin(th), y: 6600000 + rho0 - rho * Math.cos(th) };
}

// --- Coniques conformes RGF93 : zones CC42 à CC50 (EPSG:3942 à 3950) ---
// 9 zones de 1° de large (CC4x couvre x-1° à x+1°), parallèle d'origine x, méridien 3° E,
// parallèles standards x-0,75° et x+0,75°, X0 = 1 700 000 m, Y0 = 1 200 000 + (x-42) × 1 000 000 m.
function toCC(lat, lon, zone) {
  const a = 6378137, e = 0.0818191910428158, rad = Math.PI / 180;
  const m = p => Math.cos(p) / Math.sqrt(1 - e * e * Math.sin(p) ** 2);
  const t2 = p => Math.tan(Math.PI / 4 - p / 2) / Math.pow((1 - e * Math.sin(p)) / (1 + e * Math.sin(p)), e / 2);
  const p0 = zone * rad, p1 = (zone - 0.75) * rad, p2 = (zone + 0.75) * rad, l0 = 3 * rad;
  const n = (Math.log(m(p1)) - Math.log(m(p2))) / (Math.log(t2(p1)) - Math.log(t2(p2)));
  const F = m(p1) / (n * Math.pow(t2(p1), n));
  const rho = a * F * Math.pow(t2(lat * rad), n), rho0 = a * F * Math.pow(t2(p0), n);
  const th = n * (lon * rad - l0);
  return { x: 1700000 + rho * Math.sin(th), y: 1200000 + (zone - 42) * 1000000 + rho0 - rho * Math.cos(th) };
}
function ccZone(lat) { return Math.min(50, Math.max(42, Math.round(lat))); }

function haversine(a, b) {
  const R = 6371008.8, rad = Math.PI / 180;
  const dLat = (b.lat - a.lat) * rad, dLon = (b.lon - a.lon) * rad;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

function fmtDist(m) { return m < 1000 ? Math.round(m) + " m" : parseFloat((m / 1000).toFixed(m < 10000 ? 2 : 1)) + " km"; }

function niceStep(range, target) {
  const raw = range / target, p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p;
  return (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * p;
}

function readTrack(text) {
  if (/<kml[\s>]/i.test(text)) { const v = kmlVertices(text); return v ? v.pts : null; }
  const doc = new DOMParser().parseFromString(text, "application/xml");
  if (doc.getElementsByTagName("parsererror").length) return null;
  let nodes = doc.getElementsByTagName("trkpt");
  if (!nodes.length) nodes = doc.getElementsByTagName("rtept");
  const track = [];
  for (const n of nodes) {
    const e = n.getElementsByTagName("ele")[0];
    const p = { lat: num(n.getAttribute("lat")), lon: num(n.getAttribute("lon")), ele: e ? num(e.textContent) : NaN };
    if (!isNaN(p.lat) && !isNaN(p.lon) && Math.abs(p.lat) <= 90 && Math.abs(p.lon) <= 180) track.push(p);
  }
  return track;
}

// Rééchantillonne la trace en N points régulièrement espacés le long de son parcours (altitude GPX interpolée)
function resampleTrack(track, N) {
  const cum = [0];
  for (let i = 1; i < track.length; i++) cum.push(cum[i - 1] + haversine(track[i - 1], track[i]));
  const total = cum[cum.length - 1];
  if (!(total >= 1)) return null;
  const pts = [], gps = [];
  let j = 1;
  for (let k = 0; k < N; k++) {
    const d = total * k / (N - 1);
    while (j < track.length - 1 && cum[j] < d) j++;
    const a = track[j - 1], b = track[j], seg = cum[j] - cum[j - 1];
    const t2 = seg > 0 ? Math.min(1, Math.max(0, (d - cum[j - 1]) / seg)) : 0;
    pts.push({ lat: a.lat + (b.lat - a.lat) * t2, lon: a.lon + (b.lon - a.lon) * t2 });
    const ok = !isNaN(a.ele) && !isNaN(b.ele);
    gps.push(ok ? a.ele + (b.ele - a.ele) * t2 : null);
  }
  return { pts, gps, total };
}

async function runProfile(pts, total, gps) {
  const msg = $("msgP");
  try {
    const z = await profElevations(pts, $("resourceP").value);
    if (!z.length || z.every(v => v === null)) { msg.className = "err"; msg.textContent = t(M.PROF.noData); return; }
    const N = pts.length;
    lastProfile = z.map((zi, i) => ({ rang: i + 1, d: total * i / (N - 1), lat: pts[i].lat, lon: pts[i].lon, z: zi, gps: gps ? gps[i] : null }));
    $("profResult").style.display = "block";
    drawProfile(z, total, pts, gps);
    const valid = z.filter(v => v !== null);
    const first = z.find(v => v !== null), last = [...z].reverse().find(v => v !== null);
    const dPlus = valid.reduce((s, v, i) => i && valid[i - 1] < v ? s + (v - valid[i - 1]) : s, 0);
    const dMoins = valid.reduce((s, v, i) => i && valid[i - 1] > v ? s + (valid[i - 1] - v) : s, 0);
    const pente = (last - first) / total * 100;
    const T = M.PROF.stats;
    const items = [
      [t(T.dist), fmtDist(total)], [t(T.pente), (pente.toFixed(1) === "-0.0" ? "0.0" : (pente > 0 ? "+" : "") + pente.toFixed(1)) + " %"],
      [t(T.start), first.toFixed(1) + " m"], [t(T.end), last.toFixed(1) + " m"],
      [t(T.min), Math.min(...valid).toFixed(1) + " m"], [t(T.max), Math.max(...valid).toFixed(1) + " m"],
      [t(T.up), "+ " + Math.round(dPlus) + " m"], [t(T.down), "− " + Math.round(dMoins) + " m"]
    ];
    $("profInfo").innerHTML = items.map(([k, v]) => "<div><span>" + k + "</span><b>" + v + "</b></div>").join("");
    // Légende et écart moyen entre l'altitude du GPS (fichier GPX) et celle de la source
    if (gps) {
      $("profLegend").innerHTML = '<span class="lg"></span>' + t(M.PROF.srcLabel) + ' &nbsp; <span class="lg lg2"></span>' + t(M.PROF.gpsLabel);
      const ds = z.map((v, i) => v !== null && gps[i] !== null ? gps[i] - v : null).filter(d => d !== null);
      if (ds.length) {
        const mean = ds.reduce((s, d) => s + d, 0) / ds.length, abs = ds.reduce((s, d) => s + Math.abs(d), 0) / ds.length;
        $("profGps").textContent = t(M.ELE.summary, mean, abs, ds.length);
      } else $("profGps").textContent = "";
    } else { $("profLegend").innerHTML = ""; $("profGps").textContent = ""; }
    msg.className = ""; msg.textContent = "";
    $("csvP").style.display = "block";
  } catch (e) {
    msg.className = "err"; msg.textContent = t(M.PROF.error);
  }
}

$("goP").addEventListener("click", async () => {
  const msg = $("msgP");
  msg.textContent = ""; msg.className = "";
  $("csvP").style.display = "none";
  const A = parse($("ptA").value), B = parse($("ptB").value);
  const bad = p => !p || isNaN(p.lat) || isNaN(p.lon) || Math.abs(p.lat) > 90 || Math.abs(p.lon) > 180;
  if (bad(A) || bad(B)) { msg.className = "err"; msg.textContent = t(M.PROF.badCoords); return; }
  const total = haversine(A, B);
  if (total < 1) { msg.className = "err"; msg.textContent = t(M.PROF.samePoint); return; }
  const N = parseInt($("nP").value, 10) || 100, pts = [];
  msg.textContent = t(M.PROF.computing, N);
  for (let i = 0; i < N; i++) {
    const t2 = i / (N - 1);
    pts.push({ lat: A.lat + (B.lat - A.lat) * t2, lon: A.lon + (B.lon - A.lon) * t2 });
  }
  await runProfile(pts, total, null);
});

// Profil le long d'une trace GPX (au lieu d'une ligne droite entre A et B)
$("loadP").addEventListener("click", () => $("fileP").click());
$("fileP").addEventListener("change", () => {
  const file = $("fileP").files && $("fileP").files[0];
  if (!file) return;
  const msg = $("msgP");
  msg.textContent = ""; msg.className = "";
  const rd = new FileReader();
  rd.onerror = () => { msg.className = "err"; msg.textContent = t(M.PROF.fileErr); };
  rd.onload = async () => {
    const track = readTrack(String(rd.result || ""));
    const N = parseInt($("nP").value, 10) || 100;
    const rs = track && track.length >= 2 ? resampleTrack(track, N) : null;
    if (!rs) { msg.className = "err"; msg.textContent = t(M.PROF.noTrack); return; }
    const fmt = p => p.lat.toFixed(7) + ", " + p.lon.toFixed(7);
    $("ptA").value = fmt(track[0]); $("ptB").value = fmt(track[track.length - 1]);
    $("csvP").style.display = "none";
    msg.textContent = t(M.PROF.computing, N);
    await runProfile(rs.pts, rs.total, rs.gps.some(v => v !== null) ? rs.gps : null);
  };
  rd.readAsText(file);
  $("fileP").value = "";
});

function drawProfile(z, total, pts, gps) {
  const W = 640, H = 260, L = 48, R = 14, T = 12, B = 30;
  const valid = z.filter(v => v !== null);
  const all = valid.concat((gps || []).filter(v => v !== null));
  let zmin = Math.min(...all), zmax = Math.max(...all);
  if (zmax - zmin < 4) { const c = (zmax + zmin) / 2; zmin = c - 2; zmax = c + 2; }
  const step = niceStep(zmax - zmin, 4);
  const lo = Math.floor(zmin / step) * step, hi = Math.ceil(zmax / step) * step;
  const PW = W - L - R, PH = H - T - B;
  const X = i => L + (i / (z.length - 1)) * PW;
  const Y = v => T + (1 - (v - lo) / (hi - lo)) * PH;
  const f = n => n.toFixed(1);

  let g = "";
  for (let v = lo; v <= hi + step / 1000; v += step) {
    const y = Y(v);
    g += '<line class="pgrid" x1="' + L + '" x2="' + (W - R) + '" y1="' + f(y) + '" y2="' + f(y) + '"/>' +
         '<text class="plab" x="' + (L - 6) + '" y="' + f(y + 4) + '" text-anchor="end">' + (Math.round(v * 10) / 10) + '</text>';
  }
  const dstep = niceStep(total, 5);
  for (let d = 0; d <= total + dstep / 1000; d += dstep) {
    const x = L + (d / total) * PW;
    g += '<line class="ptick" x1="' + f(x) + '" x2="' + f(x) + '" y1="' + (H - B) + '" y2="' + (H - B + 4) + '"/>' +
         '<text class="plab" x="' + f(x) + '" y="' + (H - B + 17) + '" text-anchor="' + (x > W - R - 20 ? "end" : "middle") + '">' + fmtDist(d) + '</text>';
  }

  // Courbe et surface, interrompues là où il n'y a pas de données
  let line = "", area = "", run = [];
  const flush = () => {
    if (run.length > 1) {
      const p = run.map(([x, y]) => f(x) + "," + f(y)).join("L");
      line += "M" + p;
      area += "M" + f(run[0][0]) + "," + (H - B) + "L" + p + "L" + f(run[run.length - 1][0]) + "," + (H - B) + "Z";
    }
    run = [];
  };
  z.forEach((v, i) => { if (v === null) flush(); else run.push([X(i), Y(v)]); });
  flush();

  let gline = "";
  if (gps) {
    let r = [];
    const fl = () => { if (r.length > 1) gline += "M" + r.map(([x, y]) => f(x) + "," + f(y)).join("L"); r = []; };
    gps.forEach((v, i) => { if (v === null) fl(); else r.push([X(i), Y(v)]); });
    fl();
  }

  const svg = $("chart");
  svg.innerHTML = g + '<path class="parea" d="' + area + '"/><path class="pline" d="' + line + '"/>' + (gline ? '<path class="pgps" d="' + gline + '"/>' : '') +
    '<g id="pcur" style="display:none"><line class="pcl" y1="' + T + '" y2="' + (H - B) + '"/><circle class="pdot" r="5"/></g>' +
    '<rect id="pover" x="' + L + '" y="' + T + '" width="' + PW + '" height="' + PH + '" fill="transparent" style="touch-action:pan-y"/>';

  const hover = $("profHover"), cur = $("pcur"), dot = cur.querySelector("circle"), cl = cur.querySelector("line");
  hover.textContent = t(M.PROF.hint);
  const at = clientX => {
    const r = svg.getBoundingClientRect();
    const vx = (clientX - r.left) / r.width * W;
    const i = Math.max(0, Math.min(z.length - 1, Math.round((vx - L) / PW * (z.length - 1))));
    const x = X(i);
    cl.setAttribute("x1", f(x)); cl.setAttribute("x2", f(x));
    if (z[i] === null) {
      dot.style.display = "none";
      hover.textContent = t(M.PROF.hoverD) + " " + fmtDist(total * i / (z.length - 1)) + " · " + t(M.PROF.noPoint);
    } else {
      dot.style.display = ""; dot.setAttribute("cx", f(x)); dot.setAttribute("cy", f(Y(z[i])));
      hover.textContent = t(M.PROF.hoverD) + " " + fmtDist(total * i / (z.length - 1)) + " · " + t(M.PROF.hoverZ) + " " + z[i].toFixed(1) + " m · " + (gps && gps[i] != null ? "GPX " + gps[i].toFixed(1) + " m · " : "") +
        pts[i].lat.toFixed(5) + ", " + pts[i].lon.toFixed(5);
    }
    cur.style.display = "";
  };
  const over = $("pover");
  over.addEventListener("pointermove", e => at(e.clientX));
  over.addEventListener("pointerdown", e => at(e.clientX));
  over.addEventListener("pointerleave", e => { if (e.pointerType === "mouse") { cur.style.display = "none"; hover.textContent = t(M.PROF.hint); } });
}

$("csvP").addEventListener("click", () => {
  const rows = [[t(M.csv.regel), "distance_m", t(M.csv.lat), t(M.csv.lon), t(M.csv.alt)]];
  for (const p of lastProfile) rows.push([p.rang, Math.round(p.d), p.lat.toFixed(7), p.lon.toFixed(7), p.z === null ? "" : p.z.toFixed(2)]);
  if (lastProfile.some(p => p.gps != null)) {
    rows[0].push(t(M.csv.gpx));
    lastProfile.forEach((p, i) => rows[i + 1].push(p.gps != null ? p.gps.toFixed(2) : ""));
  }
  downloadCSV(rows, t(M.profName));
});

// --- Initialisation ---
setPays(PAYS);
applyLang();
updateMapLinksFromInput();
</script>
