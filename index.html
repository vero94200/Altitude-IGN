<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Altitude IGN</title>
<style>
  :root { --bg:#fff; --fg:#1b1f24; --muted:#5b6570; --card:#f2f4f7; --accent:#0b57d0; --err:#b3261e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14171a; --fg:#e8eaed; --muted:#9aa4af; --card:#20252b; --accent:#8ab4f8; --err:#f2b8b5; }
  }
  * { box-sizing:border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg);
         font:16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; max-width:560px; margin-inline:auto; }
  h1 { font-size:1.3rem; margin:4px 0 12px; }
  label { display:block; font-size:.9rem; color:var(--muted); margin:12px 0 4px; }
  input, select, button { width:100%; font:inherit; padding:12px; border-radius:10px;
         border:1px solid var(--muted); background:var(--card); color:var(--fg); }
  button { background:var(--accent); color:#fff; border:0; font-weight:600; margin-top:14px; }
  button.sec { background:var(--card); color:var(--fg); border:1px solid var(--muted); margin-top:10px; }
  #res { margin-top:18px; padding:14px; background:var(--card); border-radius:12px; display:none; }
  #alt { font-size:2rem; font-weight:700; }
  .err { color:var(--err); }
  .small { font-size:.85rem; color:var(--muted); word-break:break-all; }
  a { color:var(--accent); }
</style>
</head>
<body>
<h1>Altitude IGN d’un point</h1>

<label for="coord">Coordonnées (copiées depuis Google Maps)</label>
<input id="coord" inputmode="text" autocomplete="off" placeholder="46.7256825, -1.5683537">

<label for="resource">Source</label>
<select id="resource">
  <option value="ign_lidar_hd_mnt_mono_wld">MNT LiDAR HD (avec interpolation)</option>
  <option value="ign_lidar_hd_mnt_multi_wld" selected>MNT LiDAR HD (sans interpolation)</option>
  <option value="ign_rge_alti_wld">RGE ALTI</option>
</select>

<button id="go">Obtenir l’altitude</button>
<button id="loc" class="sec">Utiliser ma position actuelle</button>

<div id="res">
  <div id="alt"></div>
  <div id="msg"></div>
  <div id="lidarDate" class="small"></div>
  <p class="small">Point : <span id="pt"></span></p>
  <p><a id="link" target="_blank" rel="noopener">Ouvrir la requête IGN</a></p>
</div>

<script>
const $ = id => document.getElementById(id);
const BASE = "https://data.geopf.fr/altimetrie/1.0/calcul/alti/rest/elevation.json";

function num(s) { return parseFloat(String(s).replace(",", ".")); }

// --- Date d'acquisition du LiDAR HD (couche de métadonnées des dalles, WFS Géoplateforme) ---
const WFS = "https://data.geopf.fr/wfs/ows";
const META_LAYER = "IGNF_LIDAR-HD_METADONNEE:metadata";
let dateToken = 0;

function isoDay(s) { const m = String(s || "").match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? m[0] : null; }
function frDay(iso) { return iso.slice(8, 10) + "/" + iso.slice(5, 7) + "/" + iso.slice(0, 4); }

// Cherche une propriété dont le nom correspond à re, à la racine ou dans un éventuel champ JSON « metadata »
function findProp(props, re) {
  let nested = props.metadata;
  if (typeof nested === "string") { try { nested = JSON.parse(nested); } catch (e) { nested = null; } }
  for (const o of [props, nested]) {
    if (!o || typeof o !== "object") continue;
    for (const k of Object.keys(o)) { if (re.test(k) && o[k]) return o[k]; }
  }
  return null;
}

async function lidarDates(lat, lon) {
  const e = 0.00001; // ≈ 1 m autour du point
  const bbox = [lat - e, lon - e, lat + e, lon + e].map(v => v.toFixed(7)).join(",") + ",urn:ogc:def:crs:EPSG::4326";
  const url = WFS + "?SERVICE=WFS&VERSION=2.0.0&REQUEST=GetFeature&TYPENAMES=" + encodeURIComponent(META_LAYER) +
              "&OUTPUTFORMAT=application%2Fjson&COUNT=10&BBOX=" + bbox;
  const r = await fetch(url);
  if (!r.ok) throw new Error("HTTP " + r.status);
  const j = await r.json();
  const deb = [], fin = [];
  for (const f of (j.features || [])) {
    const p = f.properties || {};
    const d = isoDay(findProp(p, /debut.*acquisition|acquisition.*debut/i));
    const g = isoDay(findProp(p, /fin.*acquisition|acquisition.*fin/i));
    if (d) deb.push(d);
    if (g) fin.push(g);
  }
  if (!deb.length && !fin.length) return null;
  const all = deb.concat(fin).sort();
  return { debut: (deb.length ? deb.slice().sort()[0] : all[0]), fin: (fin.length ? fin.slice().sort().pop() : all[all.length - 1]) };
}

async function showDate(p, resource) {
  const el = $("lidarDate"), tok = ++dateToken;
  if (!resource.startsWith("ign_lidar_hd")) { el.textContent = ""; return; } // RGE ALTI : pas de date de vol unique
  el.textContent = "Date d’acquisition LiDAR : recherche…";
  try {
    const d = await lidarDates(p.lat, p.lon);
    if (tok !== dateToken) return;
    if (!d) { el.textContent = "Date d’acquisition LiDAR : non renseignée pour ce point."; return; }
    el.textContent = d.debut === d.fin
      ? "Acquisition LiDAR : " + frDay(d.debut)
      : "Acquisition LiDAR : du " + frDay(d.debut) + " au " + frDay(d.fin);
  } catch (err) {
    if (tok === dateToken) el.textContent = "Date d’acquisition LiDAR : indisponible.";
  }
}

// Accepte « 46.7256825, -1.5683537 » (Google Maps) ou « 46°42'59.5"N 1°34'08.2"W »
function parse(s) {
  s = s.trim();
  if (s.includes("°")) {
    const re = /(\d+(?:[.,]\d+)?)\s*°\s*(?:(\d+(?:[.,]\d+)?)\s*['’′]\s*)?(?:(\d+(?:[.,]\d+)?)\s*(?:"|”|″|'')\s*)?([NSEWO])/gi;
    let m, lat = null, lon = null;
    while ((m = re.exec(s)) !== null) {
      let v = num(m[1]) + (m[2] ? num(m[2]) / 60 : 0) + (m[3] ? num(m[3]) / 3600 : 0);
      const h = m[4].toUpperCase();
      if (h === "S" || h === "W" || h === "O") v = -v;
      if (h === "N" || h === "S") lat = v; else lon = v;
    }
    if (lat === null || lon === null) return null;
    return { lat, lon };
  }
  const n = s.match(/-?\d+(?:[.,]\d+)?/g);
  if (!n || n.length < 2) return null;
  return { lat: num(n[0]), lon: num(n[1]) };
}

let accText = "";

$("loc").addEventListener("click", () => {
  const box = $("res"), msg = $("msg");
  const fail = t => { box.style.display = "block"; $("alt").textContent = ""; $("lidarDate").textContent = ""; msg.className = "err"; msg.textContent = t;
                      $("pt").textContent = ""; $("link").removeAttribute("href"); };
  if (!navigator.geolocation) { fail("La localisation n’est pas disponible sur cet appareil ou ce navigateur."); return; }
  box.style.display = "block"; $("alt").textContent = ""; msg.className = ""; msg.textContent = "Recherche de la position…";
  navigator.geolocation.getCurrentPosition(
    pos => {
      $("coord").value = pos.coords.latitude.toFixed(7) + ", " + pos.coords.longitude.toFixed(7);
      accText = " (précision GPS ± " + Math.round(pos.coords.accuracy) + " m)";
      $("go").click();
    },
    err => fail(err.code === 1
      ? "Localisation refusée. Autorise-la pour ce site dans les réglages de Chrome, ou colle les coordonnées à la main."
      : "Position introuvable. Réessaie à l’extérieur ou colle les coordonnées à la main."),
    { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 }
  );
});

$("go").addEventListener("click", async () => {
  const box = $("res"), alt = $("alt"), msg = $("msg");
  box.style.display = "block"; alt.textContent = ""; msg.textContent = ""; msg.className = "";
  dateToken++; $("lidarDate").textContent = "";
  const p = parse($("coord").value);
  if (!p || Math.abs(p.lat) > 90 || Math.abs(p.lon) > 180 || isNaN(p.lat) || isNaN(p.lon)) {
    msg.className = "err"; msg.textContent = "Coordonnées non reconnues. Exemple : 46.7256825, -1.5683537";
    $("pt").textContent = ""; $("link").removeAttribute("href"); return;
  }
  const url = BASE + "?lon=" + p.lon.toFixed(7) + "&lat=" + p.lat.toFixed(7) +
              "&resource=" + $("resource").value + "&zonly=true";
  $("pt").textContent = "lat " + p.lat.toFixed(7) + ", lon " + p.lon.toFixed(7) + accText;
  accText = "";
  $("link").href = url;
  msg.textContent = "Interrogation de l’IGN…";
  try {
    const r = await fetch(url);
    const j = await r.json();
    const z = j.elevations && j.elevations[0];
    if (typeof z === "number" && z > -99990) {
      alt.textContent = z.toFixed(2) + " m";
      msg.textContent = "";
      showDate(p, $("resource").value);
    } else {
      msg.className = "err";
      msg.textContent = "Pas d’altitude pour ce point (hors couverture de cette source). Essaie une autre source.";
    }
  } catch (e) {
    msg.className = "err";
    msg.textContent = "Lecture directe impossible. Touche « Ouvrir la requête IGN » : l’altitude est la valeur entre crochets.";
  }
});
</script>
</body>
</html>
