<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Altitude IGN</title>
<style>
  :root { --bg:#fff; --fg:#1b1f24; --muted:#5b6570; --card:#f2f4f7; --accent:#0b57d0; --err:#b3261e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14171a; --fg:#e8eaed; --muted:#9aa4af; --card:#20252b; --accent:#8ab4f8; --err:#f2b8b5; }
  }
  * { box-sizing:border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg);
         font:16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; max-width:640px; margin-inline:auto; }
  h1 { font-size:1.3rem; margin:4px 0 12px; }
  h2 { font-size:1.05rem; margin:20px 0 6px; }
  label { display:block; font-size:.9rem; color:var(--muted); margin:12px 0 4px; }
  input, select, textarea, button { font:inherit; padding:12px; border-radius:10px;
         border:1px solid var(--muted); background:var(--card); color:var(--fg); }
  input, select, textarea { width:100%; }
  textarea { min-height:90px; resize:vertical; }
  button { background:var(--accent); color:#fff; border:0; font-weight:600; margin-top:14px; width:100%; cursor:pointer; }
  button.sec { background:var(--card); color:var(--fg); border:1px solid var(--muted); margin-top:10px; }
  button:disabled { opacity:.5; cursor:default; }
  .tabs { display:flex; gap:8px; margin:6px 0 4px; }
  .tabs button { margin:0; padding:10px; font-weight:600; }
  .tabs button.active { background:var(--accent); color:#fff; }
  .tabs button:not(.active) { background:var(--card); color:var(--fg); border:1px solid var(--muted); }
  .mode { display:none; }
  .mode.on { display:block; }
  #res { margin-top:18px; padding:14px; background:var(--card); border-radius:12px; display:none; }
  #alt { font-size:2rem; font-weight:700; }
  #city { font-size:1.1rem; font-weight:600; margin-top:2px; }
  .err { color:var(--err); }
  .small { font-size:.85rem; color:var(--muted); word-break:break-all; }
  table { width:100%; border-collapse:collapse; margin-top:12px; font-size:.95rem; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--muted); }
  td.r { text-align:right; font-variant-numeric:tabular-nums; }
  a { color:var(--accent); }
  #chart { width:100%; height:180px; }
  #suggestions { margin-top:6px; }
  #suggestions button { display:block; text-align:left; margin:4px 0 0; padding:8px 10px; }
  .row2 { display:flex; gap:10px; }
  .row2 > div { flex:1; min-width:0; }
</style>
</head>
<body>
<h1>Altitude IGN</h1>

<div class="tabs">
  <button id="tab1" class="active">Un point</button>
  <button id="tabN">Plusieurs points</button>
  <button id="tabP">Profil</button>
</div>

<!-- ================= UN POINT ================= -->
<div id="mode1" class="mode on">
  <label for="addr">Chercher une adresse (optionnel)</label>
  <input id="addr" placeholder="ex : 12 rue de la Paix, La Roche-sur-Yon" autocomplete="off">
  <div id="suggestions"></div>

  <label for="coord">Coordonnées (copiées depuis Google Maps)</label>
  <input id="coord" inputmode="text" autocomplete="off" placeholder="46.7256825, -1.5683537">

  <label for="resource">Source</label>
  <select id="resource">
    <option value="ign_lidar_hd_mnt_mono_wld">MNT LiDAR HD (avec interpolation)</option>
    <option value="ign_lidar_hd_mnt_multi_wld" selected>MNT LiDAR HD (sans interpolation)</option>
    <option value="ign_rge_alti_wld">RGE ALTI</option>
  </select>

  <button id="go">Obtenir l’altitude</button>
  <button id="loc" class="sec">Utiliser ma position actuelle</button>

  <div id="res">
    <div id="alt"></div>
    <button id="copyalt" class="sec" style="display:none">Copier l’altitude</button>
    <div id="city"></div>
    <div id="msg"></div>
    <div id="lidarDate" class="small"></div>
    <div id="precision" class="small"></div>
    <p class="small">Point : <span id="pt"></span></p>
    <p><a id="link" target="_blank" rel="noopener">Ouvrir la requête IGN</a></p>
  </div>
</div>

<!-- ================= PLUSIEURS POINTS ================= -->
<div id="modeN" class="mode">
  <label for="coordsN">Une coordonnée par ligne (lat, lon)</label>
  <textarea id="coordsN" placeholder="46.7256825, -1.5683537
46.7301, -1.5742
46.7185, -1.5601"></textarea>

  <label for="resourceN">Source</label>
  <select id="resourceN">
    <option value="ign_lidar_hd_mnt_mono_wld">MNT LiDAR HD (avec interpolation)</option>
    <option value="ign_lidar_hd_mnt_multi_wld" selected>MNT LiDAR HD (sans interpolation)</option>
    <option value="ign_rge_alti_wld">RGE ALTI</option>
  </select>

  <button id="goN">Calculer les altitudes</button>
  <button id="csv" class="sec" style="display:none">Exporter en CSV</button>
  <div id="msgN"></div>
  <div id="tableN"></div>
</div>

<!-- ================= PROFIL ================= -->
<div id="modeP" class="mode">
  <div class="row2">
    <div>
      <label for="ptA">Point A (lat, lon)</label>
      <input id="ptA" placeholder="46.7256825, -1.5683537">
    </div>
    <div>
      <label for="ptB">Point B (lat, lon)</label>
      <input id="ptB" placeholder="46.7510, -1.5900">
    </div>
  </div>
  <label for="resourceP">Source</label>
  <select id="resourceP">
    <option value="ign_lidar_hd_mnt_mono_wld">MNT LiDAR HD (avec interpolation)</option>
    <option value="ign_lidar_hd_mnt_multi_wld" selected>MNT LiDAR HD (sans interpolation)</option>
    <option value="ign_rge_alti_wld">RGE ALTI</option>
  </select>
  <button id="goP">Tracer le profil</button>
  <div id="msgP"></div>
  <div id="profResult">
    <svg id="chart" preserveAspectRatio="none" viewBox="0 0 600 180"><polyline id="profLine" fill="none" stroke="#0b57d0" stroke-width="2"></polyline></svg>
    <div id="profInfo" class="small"></div>
    <button id="csvP" class="sec" style="display:none">Exporter le profil en CSV</button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const BASE = "https://data.geopf.fr/altimetrie/1.0/calcul/alti/rest/elevation.json";

// --- Onglets ---
const tabs = { tab1:"mode1", tabN:"modeN", tabP:"modeP" };
for (const t of Object.keys(tabs)) $(t).addEventListener("click", () => {
  for (const k of Object.keys(tabs)) {
    $(k).classList.toggle("active", k === t);
    $(tabs[k]).classList.toggle("on", k === t);
  }
});

function num(s) { return parseFloat(String(s).replace(",", ".")); }
function frDay(iso) { return iso.slice(8, 10) + "/" + iso.slice(5, 7) + "/" + iso.slice(0, 4); }
function isoDay(s) { const m = String(s || "").match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? m[0] : null; }

// Précision indicative des sources
const PRECISION = {
  ign_lidar_hd_mnt_mono_wld: "Précision verticale indicative : ±0,20 m (LiDAR HD)",
  ign_lidar_hd_mnt_multi_wld: "Précision verticale indicative : ±0,20 m (LiDAR HD)",
  ign_rge_alti_wld: "Précision verticale indicative : ±0,50 m (plat) à ±3 m (forte pente) (RGE ALTI)"
};

// --- Date d'acquisition du LiDAR HD (métadonnées des dalles, WFS Géoplateforme) ---
const WFS = "https://data.geopf.fr/wfs/ows";
const META_LAYER = "IGNF_LIDAR-HD_METADONNEE:metadata";
let dateToken = 0;

function findProp(props, re) {
  let nested = props.metadata;
  if (typeof nested === "string") { try { nested = JSON.parse(nested); } catch (e) { nested = null; } }
  for (const o of [props, nested]) {
    if (!o || typeof o !== "object") continue;
    for (const k of Object.keys(o)) { if (re.test(k) && o[k]) return o[k]; }
  }
  return null;
}

async function lidarDates(lat, lon) {
  const e = 0.00001;
  const bbox = [lat - e, lon - e, lat + e, lon + e].map(v => v.toFixed(7)).join(",") + ",urn:ogc:def:crs:EPSG::4326";
  const url = WFS + "?SERVICE=WFS&VERSION=2.0.0&REQUEST=GetFeature&TYPENAMES=" + encodeURIComponent(META_LAYER) +
              "&OUTPUTFORMAT=application%2Fjson&COUNT=10&BBOX=" + bbox;
  const r = await fetch(url);
  if (!r.ok) throw new Error("HTTP " + r.status);
  const j = await r.json();
  const deb = [], fin = [];
  for (const f of (j.features || [])) {
    const p = f.properties || {};
    const d = isoDay(findProp(p, /debut.*acquisition|acquisition.*debut/i));
    const g = isoDay(findProp(p, /fin.*acquisition|acquisition.*fin/i));
    if (d) deb.push(d);
    if (g) fin.push(g);
  }
  if (!deb.length && !fin.length) return null;
  const all = deb.concat(fin).sort();
  return { debut: (deb.length ? deb.slice().sort()[0] : all[0]), fin: (fin.length ? fin.slice().sort().pop() : all[all.length - 1]) };
}

async function showDate(p, resource) {
  const el = $("lidarDate"), tok = ++dateToken;
  if (!resource.startsWith("ign_lidar_hd")) { el.textContent = ""; return; }
  el.textContent = "Date d’acquisition LiDAR : recherche…";
  try {
    const d = await lidarDates(p.lat, p.lon);
    if (tok !== dateToken) return;
    if (!d) { el.textContent = "Date d’acquisition LiDAR : non renseignée pour ce point."; return; }
    el.textContent = d.debut === d.fin
      ? "Acquisition LiDAR : " + frDay(d.debut)
      : "Acquisition LiDAR : du " + frDay(d.debut) + " au " + frDay(d.fin);
  } catch (err) {
    if (tok === dateToken) el.textContent = "Date d’acquisition LiDAR : indisponible.";
  }
}

// --- Commune du point ---
const GEO = "https://geo.api.gouv.fr/communes";
let cityToken = 0;

async function showCity(p) {
  const el = $("city"), tok = ++cityToken;
  el.textContent = "Commune : recherche…";
  try {
    const r = await fetch(GEO + "?lat=" + p.lat.toFixed(7) + "&lon=" + p.lon.toFixed(7) +
                          "&fields=nom,codesPostaux,departement&format=json");
    if (!r.ok) throw new Error("HTTP " + r.status);
    const j = await r.json();
    if (tok !== cityToken) return;
    if (!j.length) { el.textContent = "Commune : aucune (hors France ou en mer)."; return; }
    const c = j[0];
    const cp = c.codesPostaux && c.codesPostaux.length === 1 ? " (" + c.codesPostaux[0] + ")" : "";
    const dep = c.departement ? ", " + c.departement.nom : "";
    el.textContent = c.nom + cp + dep;
  } catch (err) {
    if (tok === cityToken) el.textContent = "Commune : indisponible.";
  }
}

// Accepte « 46.7256825, -1.5683537 » ou « 46°42'59.5"N 1°34'08.2"W »
function parse(s) {
  s = String(s || "").trim();
  if (!s) return null;
  if (s.includes("°")) {
    const re = /(\d+(?:[.,]\d+)?)\s*°\s*(?:(\d+(?:[.,]\d+)?)\s*['’′]\s*)?(?:(\d+(?:[.,]\d+)?)\s*(?:"|”|″|'')\s*)?([NSEWO])/gi;
    let m, lat = null, lon = null;
    while ((m = re.exec(s)) !== null) {
      let v = num(m[1]) + (m[2] ? num(m[2]) / 60 : 0) + (m[3] ? num(m[3]) / 3600 : 0);
      const h = m[4].toUpperCase();
      if (h === "S" || h === "W" || h === "O") v = -v;
      if (h === "N" || h === "S") lat = v; else lon = v;
    }
    if (lat === null || lon === null) return null;
    return { lat, lon };
  }
  const n = s.match(/-?\d+(?:[.,]\d+)?/g);
  if (!n || n.length < 2) return null;
  return { lat: num(n[0]), lon: num(n[1]) };
}

let accText = "";

// --- Recherche d'adresse (API adresse data.gouv.fr) ---
let sugToken = 0;
$("addr").addEventListener("input", async () => {
  const q = $("addr").value.trim(), box = $("suggestions"), tok = ++sugToken;
  if (q.length < 3) { box.innerHTML = ""; return; }
  try {
    const r = await fetch("https://api-adresse.data.gouv.fr/search/?q=" + encodeURIComponent(q) + "&limit=4");
    const j = await r.json();
    if (tok !== sugToken) return;
    box.innerHTML = "";
    for (const f of (j.features || [])) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = f.properties.label;
      b.addEventListener("click", () => {
        const [lon, lat] = f.geometry.coordinates;
        $("coord").value = lat.toFixed(7) + ", " + lon.toFixed(7);
        $("addr").value = f.properties.label;
        box.innerHTML = "";
      });
      box.appendChild(b);
    }
  } catch (e) { if (tok === sugToken) box.innerHTML = ""; }
});

// --- Mode un point ---
$("loc").addEventListener("click", () => {
  const box = $("res"), msg = $("msg");
  const fail = t => { box.style.display = "block"; $("alt").textContent = ""; $("lidarDate").textContent = ""; $("city").textContent = ""; msg.className = "err"; msg.textContent = t;
                      $("pt").textContent = ""; $("link").removeAttribute("href"); };
  if (!navigator.geolocation) { fail("La localisation n’est pas disponible sur cet appareil ou ce navigateur."); return; }
  box.style.display = "block"; $("alt").textContent = ""; msg.className = ""; msg.textContent = "Recherche de la position…";
  navigator.geolocation.getCurrentPosition(
    pos => {
      $("coord").value = pos.coords.latitude.toFixed(7) + ", " + pos.coords.longitude.toFixed(7);
      accText = " (précision GPS ± " + Math.round(pos.coords.accuracy) + " m)";
      $("go").click();
    },
    err => fail(err.code === 1
      ? "Localisation refusée. Autorise-la pour ce site dans les réglages de Chrome, ou colle les coordonnées à la main."
      : "Position introuvable. Réessaie à l’extérieur ou colle les coordonnées à la main."),
    { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 }
  );
});

$("go").addEventListener("click", async () => {
  const box = $("res"), alt = $("alt"), msg = $("msg");
  box.style.display = "block"; alt.textContent = ""; msg.textContent = ""; msg.className = "";
  $("copyalt").style.display = "none";
  dateToken++; $("lidarDate").textContent = "";
  cityToken++; $("city").textContent = "";
  const p = parse($("coord").value);
  if (!p || Math.abs(p.lat) > 90 || Math.abs(p.lon) > 180 || isNaN(p.lat) || isNaN(p.lon)) {
    msg.className = "err"; msg.textContent = "Coordonnées non reconnues. Exemple : 46.7256825, -1.5683537";
    $("pt").textContent = ""; $("link").removeAttribute("href"); return;
  }
  const resource = $("resource").value;
  const url = BASE + "?lon=" + p.lon.toFixed(7) + "&lat=" + p.lat.toFixed(7) + "&resource=" + resource + "&zonly=true";
  $("pt").textContent = "lat " + p.lat.toFixed(7) + ", lon " + p.lon.toFixed(7) + accText;
  accText = "";
  $("link").href = url;
  $("precision").textContent = PRECISION[resource] || "";
  showCity(p);
  msg.textContent = "Interrogation de l’IGN…";
  try {
    const r = await fetch(url);
    const j = await r.json();
    const z = j.elevations && j.elevations[0];
    if (typeof z === "number" && z > -99990) {
      alt.textContent = z.toFixed(2) + " m";
      $("copyalt").style.display = "block";
      msg.textContent = "";
      showDate(p, resource);
    } else {
      msg.className = "err";
      msg.textContent = "Pas d’altitude pour ce point (hors couverture de cette source). Essaie une autre source.";
    }
  } catch (e) {
    msg.className = "err";
    msg.textContent = "Lecture directe impossible. Touche « Ouvrir la requête IGN » : l’altitude est la valeur entre crochets.";
  }
});

$("copyalt").addEventListener("click", () => navigator.clipboard.writeText($("alt").textContent.replace(" m", "").trim()));

// --- Mode plusieurs points ---
let lastMulti = [];

$("goN").addEventListener("click", async () => {
  const msg = $("msgN");
  msg.textContent = ""; msg.className = "";
  const lines = $("coordsN").value.split("\n").map(l => l.trim()).filter(Boolean);
  const pts = lines.map(parse);
  if (!pts.length || pts.some(p => !p || isNaN(p.lat) || isNaN(p.lon) || Math.abs(p.lat) > 90 || Math.abs(p.lon) > 180)) {
    msg.className = "err"; msg.textContent = "Au moins une ligne n’est pas reconnue. Une coordonnée par ligne, ex : 46.7256825, -1.5683537";
    return;
  }
  msg.textContent = "Interrogation de l’IGN (" + pts.length + " points)…";
  // Requêtes par lots de 50 points (limite de l'API)
  try {
    const zs = [];
    for (let i = 0; i < pts.length; i += 50) {
      const batch = pts.slice(i, i + 50);
      const url = BASE + "?lon=" + batch.map(p => p.lon.toFixed(7)).join("|") +
                  "&lat=" + batch.map(p => p.lat.toFixed(7)).join("|") +
                  "&resource=" + $("resourceN").value + "&zonly=true";
      const r = await fetch(url);
      const j = await r.json();
      (j.elevations || []).forEach(z => zs.push(typeof z === "number" ? z : null));
    }
    lastMulti = pts.map((p, i) => ({ ...p, z: zs[i], ligne: i + 1 }));
    msg.textContent = "";
    $("csv").style.display = "block";
    renderMulti();
  } catch (e) {
    msg.className = "err";
    msg.textContent = "Erreur lors de l’interrogation de l’API IGN (réseau ou quota).";
  }
});

async function renderMulti() {
  const tbl = $("tableN");
  let html = "<table><tr><th>#</th><th>Latitude</th><th>Longitude</th><th>Altitude</th><th>Commune</th></tr>";
  for (const p of lastMulti) {
    let com = "";
    try {
      const r = await fetch(GEO + "?lat=" + p.lat.toFixed(7) + "&lon=" + p.lon.toFixed(7) + "&fields=nom&format=json");
      const j = await r.json();
      com = j.length ? j[0].nom : "";
    } catch (e) {}
    html += "<tr><td>" + p.ligne + "</td><td>" + p.lat.toFixed(6) + "</td><td>" + p.lon.toFixed(6) + "</td><td class='r'>" +
            (p.z != null && p.z > -99990 ? p.z.toFixed(2) + " m" : "—") + "</td><td>" + com + "</td></tr>";
  }
  html += "</table>";
  tbl.innerHTML = html;
}

$("csv").addEventListener("click", () => {
  const rows = [["ligne", "latitude", "longitude", "altitude_m"]];
  for (const p of lastMulti) rows.push([p.ligne, p.lat, p.lon, p.z != null && p.z > -99990 ? p.z.toFixed(2) : ""]);
  downloadCSV(rows, "altitudes-ign.csv");
});

function downloadCSV(rows, name) {
  const csv = rows.map(r => r.join(";")).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8" }));
  a.download = name;
  a.click();
}

// --- Mode profil ---
let lastProfile = [];

$("goP").addEventListener("click", async () => {
  const msg = $("msgP");
  msg.textContent = ""; msg.className = "";
  $("csvP").style.display = "none";
  const A = parse($("ptA").value), B = parse($("ptB").value);
  if (!A || !B || isNaN(A.lat) || isNaN(B.lat)) {
    msg.className = "err"; msg.textContent = "Coordonnées A ou B non reconnues.";
    return;
  }
  msg.textContent = "Calcul du profil (100 points)…";
  const N = 100, lons = [], lats = [];
  for (let i = 0; i < N; i++) {
    const t = i / (N - 1);
    lats.push((A.lat + (B.lat - A.lat) * t).toFixed(7));
    lons.push((A.lon + (B.lon - A.lon) * t).toFixed(7));
  }
  try {
    const url = BASE + "?lon=" + lons.join("|") + "&lat=" + lats.join("|") +
                "&resource=" + $("resourceP").value + "&zonly=true";
    const r = await fetch(url);
    const j = await r.json();
    const z = (j.elevations || []).map(v => (typeof v === "number" && v > -99990) ? v : null);
    if (!z.length || z.every(v => v === null)) { msg.className = "err"; msg.textContent = "Pas de données pour ce tracé (hors couverture)."; return; }
    lastProfile = z.map((zi, i) => i + 1).map(i => ({ i, z: z[i - 1] }));
    drawProfile(z);
    const valid = z.filter(v => v !== null);
    const dPlus = valid.reduce((s, v, i) => i && valid[i - 1] < v ? s + (v - valid[i - 1]) : s, 0);
    const dMoins = valid.reduce((s, v, i) => i && valid[i - 1] > v ? s + (valid[i - 1] - v) : s, 0);
    const dist = Math.round(Math.hypot((B.lat - A.lat) * 111320, (B.lon - A.lon) * 111320 * Math.cos(A.lat * Math.PI / 180)));
    $("profInfo").textContent = "Distance ≈ " + dist + " m · min " + Math.min(...valid).toFixed(1) + " m · max " +
      Math.max(...valid).toFixed(1) + " m · dénivelé + " + Math.round(dPlus) + " m / " + Math.round(dMoins) + " m";
    msg.textContent = "";
    $("csvP").style.display = "block";
  } catch (e) {
    msg.className = "err"; msg.textContent = "Erreur lors de l’interrogation de l’API IGN (réseau ou quota).";
  }
});

function drawProfile(z) {
  const valid = z.filter(v => v !== null);
  const zmin = Math.min(...valid), zmax = Math.max(...valid);
  const pad = (zmax - zmin) < 10 ? 10 : (zmax - zmin) * 0.1;
  const lo = zmin - pad, hi = zmax + pad;
  const W = 600, H = 180;
  const pts = z.map((v, i) => v === null ? "" : (i / (z.length - 1)) * W + "," + (H - ((v - lo) / (hi - lo)) * H));
  $("profLine").setAttribute("points", pts.filter(Boolean).join(" "));
}

$("csvP").addEventListener("click", () => {
  const rows = [["rang", "altitude_m"]];
  for (const p of lastProfile) rows.push([p.i, p.z === null ? "" : p.z.toFixed(2)]);
  downloadCSV(rows, "profil-altimetrique.csv");
});
</script>
</body>
</html>
